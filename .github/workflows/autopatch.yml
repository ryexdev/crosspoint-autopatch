name: Autopatch Build
# Polls the official CrossPoint repo for new releases. When one appears,
# rebuilds it with the patches in patches/ applied and publishes the result
# as a release on this repo (same tag, firmware.bin asset). The device's OTA
# updater is patched to point here, so it self-updates with the fix applied.

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  UPSTREAM: crosspoint-reader/crosspoint-reader
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.compare.outputs.upstream_tag }}
      version: ${{ steps.compare.outputs.version }}
      build: ${{ steps.compare.outputs.build }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare upstream release with ours
        id: compare
        run: |
          UPSTREAM_TAG=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name)
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Could not read upstream latest release tag" >&2
            exit 1
          fi
          # We publish at upstream's version with the patch component bumped by one.
          # The on-device OTA updater only compares major.minor.patch, so this makes an
          # autopatch build read as newer than the plain upstream release of the same
          # tag (delivering the patches), while any later upstream release bumps our
          # version again and supersedes it. Our tags never equal upstream's, so a new
          # upstream release always retriggers a build.
          BASE=${UPSTREAM_TAG#v}
          MA=$(echo "$BASE" | cut -d. -f1)
          MI=$(echo "$BASE" | cut -d. -f2)
          PA=$(echo "$BASE" | cut -d. -f3 | grep -o '^[0-9]\+')
          if [ -z "$MA" ] || [ -z "$MI" ] || [ -z "$PA" ]; then
            echo "Unexpected upstream tag format: $UPSTREAM_TAG" >&2
            exit 1
          fi
          OUR_VERSION="$MA.$MI.$((PA+1))"
          OWN_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name 2>/dev/null || echo "none")
          echo "Upstream: $UPSTREAM_TAG  Ours would be: $OUR_VERSION  Current ours: $OWN_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$OUR_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$OUR_VERSION" = "$OWN_TAG" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub disables scheduled workflows in repos with no commit activity
      # for 60 days. Push an empty keepalive commit before that happens.
      - name: Keepalive
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          if [ "$AGE_DAYS" -ge 50 ]; then
            git config user.name "autopatch-bot"
            git config user.email "actions@github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone upstream at release tag
        run: |
          git clone --depth 1 --branch "${{ needs.check.outputs.upstream_tag }}" \
            --recurse-submodules --shallow-submodules \
            "https://github.com/$UPSTREAM" upstream

      # Strict application: any conflict with upstream changes fails the job,
      # which emails the repo owner. Review the drift, refresh the patch,
      # re-run the workflow.
      - name: Apply patches
        run: |
          cd upstream
          for p in ../patches/*.patch; do
            echo "=== Applying $p"
            git apply --verbose "$p"
          done

      # Bake our bumped version (upstream patch + 1) into the firmware so the
      # on-device CROSSPOINT_VERSION matches the release tag and the OTA updater
      # offers it. gh_release reads -DCROSSPOINT_VERSION from [crosspoint] version.
      - name: Set autopatch version
        working-directory: upstream
        run: |
          sed -i "s/^version = .*/version = ${{ needs.check.outputs.version }}/" platformio.ini
          grep -n '^version = ' platformio.ini

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('upstream/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint (gh_release)
        working-directory: upstream
        run: pio run -e gh_release

      - name: Publish release
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          UPSTREAM_TAG="${{ needs.check.outputs.upstream_tag }}"
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "CrossPoint $VERSION (autopatch)" \
            --notes "Built from upstream [$UPSTREAM_TAG](https://github.com/$UPSTREAM/releases/tag/$UPSTREAM_TAG) with patches/ applied. Version bumped to $VERSION so the on-device OTA updater offers it." \
            upstream/.pio/build/gh_release/firmware.bin \
            upstream/.pio/build/gh_release/bootloader.bin \
            upstream/.pio/build/gh_release/partitions.bin

      - name: Open issue on failure
        if: failure()
        run: |
          UPSTREAM_TAG="${{ needs.check.outputs.upstream_tag }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Autopatch build failed for upstream $UPSTREAM_TAG" \
            --body "The autopatch build for upstream release **$UPSTREAM_TAG** failed — most likely a patch no longer applies because upstream changed that code. See the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Review upstream's changes, refresh the patch in patches/, and re-run the workflow." \
            || true
